spring.application.name=community-hero-ai
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/community_hero_ai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.security.firebase-project-id=${FIREBASE_PROJECT_ID:}
app.security.admin-emails=${ADMIN_EMAILS:}
app.ledger.hmac-secret=${LEDGER_HMAC_SECRET:}

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta
google.street-view.api-key=${GOOGLE_STREET_VIEW_API_KEY:}
google.street-view.base-url=${GOOGLE_STREET_VIEW_BASE_URL:https://maps.googleapis.com/maps/api/streetview}
google.cloud-vision.api-key=${GOOGLE_CLOUD_VISION_API_KEY:}
google.cloud-vision.base-url=${GOOGLE_CLOUD_VISION_BASE_URL:https://vision.googleapis.com/v1/images:annotate}
google.cloud-vision.auth-mode=${GOOGLE_CLOUD_VISION_AUTH_MODE:auto}

app.media.gcs-bucket=${MEDIA_GCS_BUCKET:}
app.media.gcs-prefix=${MEDIA_GCS_PREFIX:evidence}
app.geocoding.base-url=${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
app.geocoding.user-agent=${GEOCODING_USER_AGENT:CommunityHeroAI/1.0}

app.email.enabled=${EMAIL_SENDING_ENABLED:false}
app.email.resend-api-key=${RESEND_API_KEY:}
app.email.resend-from=${RESEND_FROM:Community Hero AI <onboarding@resend.dev>}
app.email.resend-base-url=${RESEND_BASE_URL:https://api.resend.com}
app.email.authorities.pothole=${AUTHORITY_EMAIL_POTHOLE:}
app.email.authorities.water-leakage=${AUTHORITY_EMAIL_WATER_LEAKAGE:}
app.email.authorities.streetlight-damage=${AUTHORITY_EMAIL_STREETLIGHT_DAMAGE:}
app.email.authorities.waste-management=${AUTHORITY_EMAIL_WASTE_MANAGEMENT:}
app.email.authorities.drainage-issue=${AUTHORITY_EMAIL_DRAINAGE_ISSUE:}
app.workflow.authority-enabled=${AUTHORITY_WORKFLOW_ENABLED:true}
app.demo.seed-on-start=${DEMO_DATA_SEED_ON_START:false}
app.demo.reset-on-start=${DEMO_DATA_RESET_ON_START:true}
app.demo.primary-email=${DEMO_PRIMARY_EMAIL:}
app.demo.media-base-url=${DEMO_MEDIA_BASE_URL:http://localhost:8080}
app.demo.seed-token=${DEMO_SEED_TOKEN:}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=80MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
